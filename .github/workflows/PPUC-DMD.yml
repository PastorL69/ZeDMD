name: PPUC-DMD

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION_MAJOR=$(grep -Eo "ZEDMD_VERSION_MAJOR\s+[0-9]+" src/version.h | grep -Eo "[0-9]+")
          VERSION_MINOR=$(grep -Eo "ZEDMD_VERSION_MINOR\s+[0-9]+" src/version.h | grep -Eo "[0-9]+")
          VERSION_PATCH=$(grep -Eo "ZEDMD_VERSION_PATCH\s+[0-9]+" src/version.h | grep -Eo "[0-9]+")
          TAG="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          echo "${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      - name: Check git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED_TAG="v${{ steps.version.outputs.tag }}"
          if [[ "${GIT_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Error: Git tag (${GIT_TAG}) does not match version from version.h (v${{ steps.version.outputs.tag }})"
            exit 1
          fi

  pio-run:
    runs-on: ubuntu-latest
    needs: [ version ]
    strategy:
      fail-fast: false
      matrix:
        panels:
          - PPUC-DMD_128x32_ZeDMD
          - PPUC-DMD_256x64_P2_ZeDMD
          - PPUC-DMD_256x64_P1875_ZeDMD
          - PPUC-DMD_128x16
          - PPUC-DMD_128x32
          - PPUC-DMD_192x64
          - PPUC-DMD_256x64_P2
          - PPUC-DMD_256x64_P1875

    name: ${{ matrix.panels }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio rich_click intelhex

      - name: Build firmware
        run: |
          VERSION="v${{ needs.version.outputs.tag }}"
          pio run -e ${{ matrix.panels }}
          pio run -e ${{ matrix.panels }} -t buildfs
          pio run -e ${{ matrix.panels }} -t buildunified 2>&1 | tee build.log
          BUILD_DIR=.pio/build/${{ matrix.panels }}

          # Extract raw offset string (e.g., 0x101bf000)
          FS_OFFSET=$(grep -oE -- '--offset 0x[0-9a-fA-F]+' build.log | grep -oE '0x[0-9a-fA-F]+' | tail -n 1)

          # Merge code .bin (at 0x10000000) and LittleFS .bin (at $FS_OFFSET) into a single sparse HEX file
          python3 -c "
          from intelhex import IntelHex
          ih = IntelHex()
          ih.loadbin('$BUILD_DIR/firmware.bin', offset=0x10000000)
          ih.loadbin('$BUILD_DIR/littlefs.bin', offset=int('$FS_OFFSET', 16))
          ih.tofile('firmware-${{ matrix.panels }}-${VERSION}.hex', format='hex')
          "

          # Create unpadded update-only HEX file
          python3 -c "
          from intelhex import IntelHex
          ih = IntelHex()
          ih.loadbin('$BUILD_DIR/firmware.bin', offset=0x10000000)
          ih.tofile('firmware-update-${{ matrix.panels }}-${VERSION}.hex', format='hex')
          "

          # Artifact copies
          cp $BUILD_DIR/firmware_with_fs.uf2 firmware-${{ matrix.panels }}-${VERSION}.uf2
          cp $BUILD_DIR/firmware.uf2 firmware-update-${{ matrix.panels }}-${VERSION}.uf2

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.panels }}
          path: |
            firmware-${{ matrix.panels }}-v${{ needs.version.outputs.tag }}.uf2
            firmware-update-${{ matrix.panels }}-v${{ needs.version.outputs.tag }}.uf2
            firmware-${{ matrix.panels }}-v${{ needs.version.outputs.tag }}.hex
            firmware-update-${{ matrix.panels }}-v${{ needs.version.outputs.tag }}.hex

  post-build:
    runs-on: ubuntu-latest
    needs: [ version, pio-run ]
    name: Release
    steps:
      - uses: actions/download-artifact@v7
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="v${{ needs.version.outputs.tag }}"

          for panel in PPUC-DMD_128x32_ZeDMD PPUC-DMD_256x64_P2_ZeDMD PPUC-DMD_256x64_P1875_ZeDMD PPUC-DMD_128x16 PPUC-DMD_128x32 PPUC-DMD_192x64 PPUC-DMD_256x64_P2 PPUC-DMD_256x64_P1875; do
            cd "${panel}"
            echo "${{ needs.version.outputs.tag }}" > version.txt
            zip "../${panel}-${VERSION}.zip" \
              "firmware-${panel}-${VERSION}.uf2" \
              "firmware-update-${panel}-${VERSION}.uf2" \
              "firmware-${panel}-${VERSION}.hex" \
              "firmware-update-${panel}-${VERSION}.hex" \
              version.txt
            cd ..
          done

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            PPUC-DMD_128x32_ZeDMD-v${{ needs.version.outputs.tag }}.zip
            PPUC-DMD_256x64_P2_ZeDMD-v${{ needs.version.outputs.tag }}.zip
            PPUC-DMD_256x64_P1875_ZeDMD-v${{ needs.version.outputs.tag }}.zip
            PPUC-DMD_128x16-v${{ needs.version.outputs.tag }}.zip
            PPUC-DMD_128x32-v${{ needs.version.outputs.tag }}.zip
            PPUC-DMD_192x64-v${{ needs.version.outputs.tag }}.zip
            PPUC-DMD_256x64_P2-v${{ needs.version.outputs.tag }}.zip
            PPUC-DMD_256x64_P1875-v${{ needs.version.outputs.tag }}.zip